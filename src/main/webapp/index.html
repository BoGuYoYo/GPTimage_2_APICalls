<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewAPI 图片生成 Demo</title>
    <style>
        :root { --w: 920px; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            margin: 24px;
            color: #222;
        }
        .wrap { max-width: var(--w); margin: 0 auto; }
        h1 { margin-bottom: 8px; }
        .desc { color: #666; margin-bottom: 18px; }

        .card {
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            background: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 10px 12px;
            align-items: center;
        }

        input, select, textarea, button {
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            padding: 10px 12px;
            outline: none;
        }

        textarea { min-height: 120px; resize: vertical; }

        input:focus, select:focus, textarea:focus {
            border-color: #4096ff;
            box-shadow: 0 0 0 3px rgba(64,150,255,.15);
        }

        .actions { margin-top: 14px; display: flex; gap: 10px; }
        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
        }
        #generateBtn { background: #1677ff; color: white; }
        #generateBtn:disabled { opacity: 0.65; cursor: not-allowed; }

        .hint { color: #888; font-size: 12px; margin-top: 4px; }
        #status { color: #1677ff; margin-top: 8px; min-height: 20px; }
        #error { color: #cf1322; margin-top: 8px; white-space: pre-wrap; min-height: 20px; }

        .result img {
            max-width: 100%;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }

        pre {
            margin-top: 10px;
            background: #0b1020;
            color: #d7e3ff;
            padding: 12px;
            border-radius: 10px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.5;
            max-height: 300px;
        }

        .small {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>图片生成（NewAPI 兼容）</h1>
    <div class="desc">输入 API 配置与提示词，点击“生成图片”。</div>

    <div class="card">
        <div class="grid">
            <label for="apiBase">API Base</label>
            <div>
                <input id="apiBase" type="text" value="https://www.kuyaoapi.com" placeholder="例如 https://www.kuyaoapi.com" />
                <div class="hint">最终请求地址：<code>{API Base}/v1/images/generations</code></div>
            </div>

            <label for="apiKey">API Key</label>
            <div>
                <input id="apiKey" type="password" placeholder="输入你的 Key（仅当前页面使用）" />
            </div>

            <label for="model">模型</label>
            <select id="model">
                <option value="dall-e-3" selected>dall-e-3</option>
                <option value="gpt-image-2">gpt-image-2</option>
                <option value="dall-e-2">dall-e-2</option>
            </select>

            <label for="size">尺寸</label>
            <select id="size">
                <option value="1024x1024" selected>1024x1024</option>
                <option value="1792x1024">1792x1024（横版，常用于 dall-e-3）</option>
                <option value="1024x1792">1024x1792（竖版，常用于 dall-e-3）</option>
                <option value="1536x1024">1536x1024（横版，常用于 gpt-image-1）</option>
                <option value="1024x1536">1024x1536（竖版，常用于 gpt-image-1）</option>
                <option value="512x512">512x512（常用于 dall-e-2）</option>
                <option value="256x256">256x256（常用于 dall-e-2）</option>
            </select>

            <label for="quality">质量</label>
            <select id="quality">
                <option value="">(不传)</option>
                <option value="standard" selected>standard</option>
                <option value="hd">hd（dall-e-3）</option>
                <option value="high">high（gpt-image-1 编辑常见）</option>
                <option value="medium">medium</option>
                <option value="low">low</option>
                <option value="auto">auto</option>
            </select>

            <label for="style">风格</label>
            <select id="style">
                <option value="">(不传)</option>
                <option value="vivid" selected>vivid（dall-e-3）</option>
                <option value="natural">natural（dall-e-3）</option>
            </select>

            <label for="responseFormat">返回格式</label>
            <select id="responseFormat">
                <option value="url" selected>url</option>
                <option value="b64_json">b64_json</option>
            </select>

            <label for="prompt">Prompt</label>
            <textarea id="prompt" placeholder="例如：一只可爱的小海獭在湖边晒太阳，插画风，高细节，柔和光线"></textarea>
        </div>

        <div class="actions">
            <button id="generateBtn">生成图片</button>
        </div>

        <div id="status"></div>
        <div id="error"></div>
        <div class="small">提示：若出现 Failed to fetch，通常是 CORS 或网络策略导致，建议改后端代理。</div>
    </div>

    <div class="card result">
        <h3>生成结果</h3>
        <img id="resultImg" alt="生成结果" />
        <h4>原始响应</h4>
        <pre id="rawOutput"></pre>
    </div>
</div>

<!-- 引入你之前那份 app.js -->
<script src="./assets/app.js"></script>
</body>
</html>
